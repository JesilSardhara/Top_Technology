    <title>Icons</title>
    <style>
        ul{

           text-align: center;

            padding: 10px;
            margin: 2px;
            border: 2px solid;
            border-radius: 10px;

            box-shadow: 5px 5px 5px ,-5px -5px 5px;

            
        }

    </style>

      <ul>
        <li><i class="fa-brands fa-square-whatsapp"></i></li>
        <li><i class="fa-regular fa-camera"></i></li>
      </ul>
