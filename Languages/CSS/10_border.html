<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border</title>
</head>
<body>
    <h1 style="border: 2px solid red;">Hello</h1>
    <h1 style="border-width: 2px; border-style: solid; border-color: rgb(27, 165, 59);">border 2</h1>
    <h1 style="border-width: 2px; border-style: dashed; border-color: rgb(77, 64, 110);">border 2</h1>
    <h1 style="border-width: 2px; border-style: dotted; border-color: rgb(77, 64, 110);">border 2</h1>
    <h1 style="border-width: 2px; border-style: double; border-color: rgb(77, 64, 110);">border 2</h1>
    <h1 style="border-width: 2px; border-style: ridge; border-color: rgb(53, 60, 64);">border 2</h1>
    <h1 style="border: 5px inset gray;">Border data</h1>
    <h1 style="border: 5px outset gray;">Border data</h1>


     <h1 style="border-top: 5px solid gray;border-bottom: 5px solid lightcoral;">Border data</h1>

</body>
</html>
