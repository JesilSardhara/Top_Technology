<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .main {
      margin: 200px auto;
      height: 200px;
      width: 200px;
      border: 2px solid black;
    }

    .right {
      background-color: aquamarine;
      height: 200px;
      width: 200px;
      transform: translate(100%, -100%);
      transition: 0.6s;
    }
    .left {
      background-color: aquamarine;
      height: 200px;
      width: 200px;
      transform: translate(-100%, 0%);
      transition: 0.6s;
    }
    .main:hover .right {
      transform: translate(00%, 00%);
    }
    .main:hover .left {
      transform: translate(00%, -100%);
    }
    img {
      height: 350px;
      width: auto;
      border: 2px solid black;
    }
  </style>
  <body>
    <div class="main">
      <!-- <img src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcQ_Zuz3haRHrSz0f3bnMlUTGa14Qc7Z5LLQ3-l04P98hv9CMXQU"> -->
      <div class="right">right</div>
      <div class="left">left</div>
    </div>
  </body>
</html>
