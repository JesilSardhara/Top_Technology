<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Clone</title>
</head>
<body>
    
    <input type="text" id="data" onkeyup="result()" placeholder="enter ext" >
    <textarea name="" colomns="23" rows="10" id="box" placeholder="result Box"></textarea>
    <button onclick="result()">submit</button>

    <script>

        let data = document.getElementById("data")
        let box = document.getElementById("box")

        function result(){
            box.innerHTML = data.value
        }

    </script>

</body>
</html>
