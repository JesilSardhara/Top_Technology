<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>api</title>
  </head>
  <body>
    <table border="1">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Price</th>
          <th>Rating</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <script>
      fetch("https://fakestoreapi.com/products", {
        method: "GET",
      })
        .then((res) => {
          return res.json();
        })
        .then((products) => {
          console.log(products);

          products.forEach((data, index) => {
            data.rating.rate;

            let tbody = document.querySelector("tbody");

            let row = tbody.insertRow();

            let call = row.insertCell(0);
            let cell2 = row.insertCell(1);
            let cell3 = row.insertCell(2);
            let cell4 = row.insertCell(3);

            call.textContent = data.id;
            cell2.textContent = data.title;
            cell3.textContent = data.price;
            cell4.textContent = data.rating.rate;
          });
        });
    </script>
  </body>
</html>
