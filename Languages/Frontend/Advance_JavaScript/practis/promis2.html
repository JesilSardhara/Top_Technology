<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>promis</title>
</head>
<body>
    <script>

        function output(data){
            console.log(data)
        }

        let k = new Promise((res,rej)=>{
            let y = 10  
            if(y == 10){
                res("success")
            }
            else{
                rej("failed")
            }
        })
        .then((res)=>{
            output(res)
        })
        .catch((res)=>{
            output(res)
        })

    </script>
</body>
</html>
