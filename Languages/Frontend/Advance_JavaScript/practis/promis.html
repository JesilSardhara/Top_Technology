<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promises</title>
</head>
<body>
    <script>
        let j = new Promise((res,rej)=>{
            let a = 11;

            if(a==11){
                res("success")
            }
            else{
                rej("failed")
            }
        });

        console.log(j)
    </script>

</body>
</html>
