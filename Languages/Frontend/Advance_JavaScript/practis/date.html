    <title>Date in js</title>

  <body>
    <script>
      let demo = new Date();
      console.log(demo);
      console.log(demo.getDate());

      console.log(demo.getDay());
      console.log(demo.getFullYear());

      demo.setDate(8);
      console.log(demo.getDate());

       demo.setFullYear(2024)
       console.log(demo.getFullYear())
       
    </script>
