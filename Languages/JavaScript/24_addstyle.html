<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .xy{
            padding: 50px;
            text-align: center;
            background: linear-gradient(red,green,blue);
            color: white;
            font-size: 50px;
        }
        button{
            border-radius: 20px;
            padding: 20px;
            margin: 20px;
            font-size: 30px;
        }    
    </style>
</head>
<body>

    

    <h1 id="h1">Hello javascript</h1>

    <button class="button" onclick="test()">Add style</button>
    <button class="button" onclick="remove()">Remove style</button>
    <button class="button" onclick="theme()">Togglecss</button>

    
    <script>
        function test(){
            let h1_tag = document.getElementById("h1")

            h1_tag.classList.add("xy")
        }

          function remove(){
            let h1_tag = document.getElementById("h1")

            h1_tag.classList.remove("xy")
        }

          function theme(){
            let h1_tag = document.getElementById("h1")

            h1_tag.classList.toggle("xy")
        }
    </script>
</body>
</html>
