<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Time Table</title>
</head>
<body>
    <table border="1" align="center"  cellspacing="0">
        <tr>
            <th rowspan="2">Days</th>
            <th colspan="6">Time</th>
        </tr>
        <tr>
            <td>8:00</td>
            <td>9:00</td>
            <td>10:00</td>
            <td>11:00</td>
            <td>11:30</td>
            <td>12:30</td>
        </tr>
        <tr>
            <th>Monday</th>
            <td>Course 1</td>
            <td>Course 2</td>
            <td>Course 3</td>
            <td rowspan="5" align="center">B<br>R<br>E<br>A<br>K</td>
            <td>Course 4</td>
            <td></td>
        </tr>
        <tr>
            <th>Tuesday</th>
            <td  colspan = "2"></td>
            <td>Course 2</td>
            <td>Course 4</td>
            <td>Course 1</td>
        </tr>
        <tr>
            <th>Wednesday</th>
            <td>Course 3</td>
            <td colspan="2"></td>
            <td>Course 2</td>
            <td></td>
        </tr>
        <tr>
            <th>Thursday</th>
            <td rowspan="2">Course 1</td>
            <td>Course 2</td>
            <td>Course 3</td>
            <td rowspan="2" colspan="2" align="center">Thesis</td>
        </tr>
        <tr>
            <th>Friday</th>
            <td>Course 4</td>
            <td>Course 2</td>
        </tr>
    </table>
</body>
</html>
